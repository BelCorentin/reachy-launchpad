[project]
name = "reachy-launchpad"
version = "0.1.0"
description = "Local dashboard for every Reachy Mini app on this laptop: what they are, whether the robot is up, and one button to run them."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
]

[project.scripts]
reachy-launchpad = "launchpad.app:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["launchpad"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
